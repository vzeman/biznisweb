          print(task["taskArn"].rsplit("/", 1)[-1])
          print(private_ip)
          print(containers[0].get("logStreamName") or "")
          PY
          )
          RECONCILIATION_TASK_ID="${RECONCILIATION_VALUES[0]}"
          RECONCILIATION_PRIVATE_IP="${RECONCILIATION_VALUES[1]}"
          RECONCILIATION_LOG_STREAM="${RECONCILIATION_VALUES[2]:-${LOG_PREFIX}/${CONTAINER_NAME}/${RECONCILIATION_TASK_ID}}"
          RECONCILIATION_LOG_READY=false
          for _ in $(seq 1 30); do
            if aws logs get-log-events \
              --log-group-name "${LOG_GROUP}" \
              --log-stream-name "${RECONCILIATION_LOG_STREAM}" \
              --start-from-head \
              --region "${AWS_REGION}" > reconciliation-logs.json 2>/dev/null && \
              python3 - <<'PY'
          import json
          messages = [row.get("message", "") for row in json.load(open("reconciliation-logs.json", encoding="utf-8")).get("events") or []]
          has_marker = any("GROWTHBOOK_SCHEDULED_RECONCILIATION_OK:" in message for message in messages)
          has_summary = any(message.strip().startswith("{") and '"mode":"publish"' in message for message in messages)
          raise SystemExit(0 if has_marker and has_summary else 1)
          PY
            then
              RECONCILIATION_LOG_READY=true
              break
            fi
            sleep 2
          done
          if [[ "${RECONCILIATION_LOG_READY}" != "true" ]]; then
            echo "One-shot reconciliation CloudWatch marker/summary did not arrive within 60 seconds" >&2
            exit 1
          fi
          python3 <<'PY' > reconciliation-summary.env
          import json
          messages = [row.get("message", "") for row in json.load(open("reconciliation-logs.json", encoding="utf-8")).get("events") or []]
          marker = next((message for message in messages if "GROWTHBOOK_SCHEDULED_RECONCILIATION_OK:" in message), "")
          summaries = []
          for message in messages:
              text = message.strip()
              if text.startswith("{") and '"mode":"publish"' in text:
                  summaries.append(json.loads(text))
          if not marker or len(summaries) != 1:
              raise SystemExit("one-shot reconciliation success marker/summary missing")
          summary = summaries[0]
          raw_events = summary.get("raw_events")
          if summary.get("event_partitions") != 40 or type(raw_events) is not int or not 0 <= raw_events <= 50000:
              raise SystemExit(f"one-shot reconciliation bounds drift: {summary}")
          published = summary.get("published") or {}
          expected = {
              "device_facts": summary.get("device_facts"),
              "performance_facts": summary.get("performance_facts"),
              "quality_reports": summary.get("quality_reports"),
          }
          if published != expected:
              raise SystemExit("one-shot generated/published counts differ")
          for key in ("raw_events", "device_facts", "performance_facts", "quality_reports"):
              print(f"{key.upper()}={summary[key]}")
          PY
          cat reconciliation-summary.env >> "${GITHUB_ENV}"
