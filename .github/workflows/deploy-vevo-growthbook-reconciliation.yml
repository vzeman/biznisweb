name: Deploy VEVO GrowthBook Reconciliation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Exact isolated GrowthBook environment to reconcile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      confirm_deploy:
        description: Type true to create/update the disabled-first selected schedule stack
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      enable_schedule:
        description: Enable only after the localhost and one-shot reconciliation gates pass
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: vevo-growthbook-reconciliation-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-reconciliation:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_ACCOUNT_ID: '919341186960'
      AWS_REGION: eu-central-1
      RECONCILIATION_ENVIRONMENT: ${{ inputs.environment }}
      COLLECTOR_STACK_NAME: ${{ inputs.environment == 'production' && 'vevo-growthbook-production' || 'vevo-growthbook-preview' }}
      STACK_NAME: ${{ format('vevo-growthbook-reconciliation-{0}', inputs.environment) }}
      SOURCE_SCHEDULE: vevo-daily-report-email
      SOURCE_TASK_FAMILY: vevo-reporting-daily
      TARGET_TASK_FAMILY: ${{ format('vevo-growthbook-reconcile-{0}', inputs.environment) }}
      EXPECTED_TASK_ROLE: BiznisWebReportingTaskRole-vevo
      SCHEDULE_NAME: ${{ format('vevo-growthbook-reconcile-{0}', inputs.environment) }}
      SETTINGS_KEY: ${{ inputs.environment == 'production' && 'growthbook_reconciliation_production' || 'growthbook_reconciliation' }}
      SCHEDULE_EXPRESSION: ${{ inputs.environment == 'production' && 'cron(45 3 * * ? *)' || 'cron(30 3 * * ? *)' }}
      DLQ_NAME: ${{ format('vevo-growthbook-reconcile-{0}-dlq', inputs.environment) }}
      SCHEDULER_ROLE_NAME: ${{ format('vevo-growthbook-reconcile-{0}-scheduler', inputs.environment) }}
      ECR_REPOSITORY: vevo-reporting
      IMAGE_TAG: git-${{ github.sha }}
      EVIDENCE_FILE: ${{ format('vevo-growthbook-{0}-reconciliation-deploy-evidence.json', inputs.environment) }}
      TEMPLATE_PATH: infra/vevo-growthbook-reconciliation/template.yaml
      SETTINGS_PATH: projects/vevo/settings.json
      RUNTIME_PATH: /app
    steps:
      - name: Require explicit protected deployment confirmation
        shell: bash
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRM_DEPLOY}" != "true" ]]; then
            echo "Explicit reconciliation deployment confirmation is required" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate versioned runner, settings, template, and change-set gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt cfn-lint==1.55.1
          cfn-lint "${TEMPLATE_PATH}"
          python -m unittest \
            tests.test_scheduled_growthbook_reconciliation \
            tests.test_growthbook_reconciliation_changeset \
            tests.test_growthbook_reconciliation_parameters
          python scripts/security_ci.py
          python - <<'PY'
          import json
          import os

          settings = json.load(open(os.environ["SETTINGS_PATH"], encoding="utf-8"))
          actual = settings.get(os.environ["SETTINGS_KEY"])
          expected = {
              "environment": os.environ["RECONCILIATION_ENVIRONMENT"],
              "stack_name": os.environ["STACK_NAME"],
              "schedule_name": os.environ["SCHEDULE_NAME"],
              "schedule_expression": os.environ["SCHEDULE_EXPRESSION"],
              "timezone": "Europe/Bratislava",
              "rolling_partition_days": 40,
              "max_raw_events": 50000,
              "source_task_family": os.environ["SOURCE_TASK_FAMILY"],
          }
          if actual != expected:
              raise SystemExit(f"GrowthBook reconciliation settings drift: {actual!r}")
          PY

      - name: Configure authenticated AWS deployment identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve exact source runtime, network, policy, and immutable image
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${ACCOUNT_ID}" != "${EXPECTED_ACCOUNT_ID}" ]]; then
            echo "AWS account mismatch: ${ACCOUNT_ID}" >&2
            exit 1
          fi
          if aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" > reconciliation-stack-preflight.json 2>/dev/null; then
            python3 <<'PY'
          import json

          stack = json.load(open("reconciliation-stack-preflight.json", encoding="utf-8"))["Stacks"][0]
          status = str(stack.get("StackStatus") or "")
          if status not in {"CREATE_COMPLETE", "UPDATE_COMPLETE"}:
              raise SystemExit(f"reconciliation stack requires read-only diagnosis before deploy: {status}")
          PY
          fi
          aws cloudformation describe-stacks \
            --stack-name "${COLLECTOR_STACK_NAME}" \
            --region "${AWS_REGION}" > collector-stack.json
          aws scheduler get-schedule \
            --name "${SOURCE_SCHEDULE}" \
            --region "${AWS_REGION}" > source-schedule-before.json

          SOURCE_TASK_DEFINITION="$(python3 - <<'PY'
          import json
          import os

          schedule = json.load(open("source-schedule-before.json", encoding="utf-8"))
          if schedule.get("Name") != os.environ["SOURCE_SCHEDULE"] or schedule.get("State") != "ENABLED":
              raise SystemExit("VEVO source reporting schedule identity/state drift")
          target = schedule.get("Target") or {}
          ecs = target.get("EcsParameters") or {}
          task_definition = str(ecs.get("TaskDefinitionArn") or "")
          if f"task-definition/{os.environ['SOURCE_TASK_FAMILY']}:" not in task_definition:
              raise SystemExit(f"unexpected source task definition: {task_definition}")
          print(task_definition)
          PY
          )"
          aws ecs describe-task-definition \
            --task-definition "${SOURCE_TASK_DEFINITION}" \
            --region "${AWS_REGION}" > source-task-definition.json

          IMAGE_DIGEST="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve immutable VEVO reporting image digest" >&2
            exit 1
          fi
          IMAGE_IDENTIFIER="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"

          python3 - "${IMAGE_IDENTIFIER}" <<'PY' > candidate-task-definition.json
          import copy
          import json
          import os
          import sys

          image = sys.argv[1]
          source = json.load(open("source-task-definition.json", encoding="utf-8"))["taskDefinition"]
          allowed = {
              "taskRoleArn", "executionRoleArn", "networkMode", "containerDefinitions",
              "volumes", "placementConstraints", "requiresCompatibilities", "cpu", "memory",
              "ipcMode", "pidMode", "proxyConfiguration", "inferenceAccelerators",
              "ephemeralStorage", "runtimePlatform",
          }
          candidate = {
              key: copy.deepcopy(value)
              for key, value in source.items()
              if key in allowed and value not in (None, [], {})
          }
          candidate["family"] = os.environ["TARGET_TASK_FAMILY"]
          containers = candidate.get("containerDefinitions") or []
          if len(containers) != 1:
              raise SystemExit(f"expected one VEVO reporting container, got {len(containers)}")
          container = containers[0]
          container["image"] = image
          container["command"] = [
              "/bin/bash", "-lc",
              "cd /app && python scripts/run_scheduled_growthbook_reconciliation.py",
          ]
          secret_names = {str(row.get("name") or "") for row in container.get("secrets") or []}
          if "BIZNISWEB_API_TOKEN" not in secret_names:
              raise SystemExit("candidate task does not inherit the managed BiznisWeb token reference")
          expected_task_role = (
              f"arn:aws:iam::{os.environ['EXPECTED_ACCOUNT_ID']}:role/"
              f"{os.environ['EXPECTED_TASK_ROLE']}"
          )
          if candidate.get("taskRoleArn") != expected_task_role:
              raise SystemExit(f"unexpected VEVO task role: {candidate.get('taskRoleArn')}")
          if not str(candidate.get("executionRoleArn") or "").startswith(
              f"arn:aws:iam::{os.environ['EXPECTED_ACCOUNT_ID']}:role/"
          ):
              raise SystemExit("unexpected VEVO execution role")
          log_options = (container.get("logConfiguration") or {}).get("options") or {}
          if not log_options.get("awslogs-group") or not log_options.get("awslogs-stream-prefix"):
              raise SystemExit("candidate task must retain CloudWatch logs")
          json.dump(candidate, sys.stdout)
          PY

          python3 <<'PY' > reporting-policy-context.env
          import json
          import os

          environment = os.environ["RECONCILIATION_ENVIRONMENT"]
          stack = json.load(open("collector-stack.json", encoding="utf-8"))["Stacks"][0]
          if stack.get("StackStatus") != "UPDATE_COMPLETE":
              raise SystemExit(f"collector stack is not UPDATE_COMPLETE: {stack.get('StackStatus')}")
          parameters = {row["ParameterKey"]: row["ParameterValue"] for row in stack.get("Parameters") or []}
          if parameters.get("Environment") != environment or parameters.get("PublicRouteEnabled") != "true":
              raise SystemExit("collector stack is not the selected active environment boundary")
          outputs = {row["OutputKey"]: row["OutputValue"] for row in stack.get("Outputs") or []}
          required = {
              "EventBucketName", "ExperimentDatabaseName", "ReportingPolicyArn",
              "ReportingWorkGroupName",
          }
          if not required.issubset(outputs):
              raise SystemExit(f"collector stack is missing policy outputs: {sorted(required - outputs.keys())}")
          account = os.environ["EXPECTED_ACCOUNT_ID"]
          expected_policy = f"arn:aws:iam::{account}:policy/vevo-growthbook-reporting-{environment}"
          if outputs["ReportingPolicyArn"] != expected_policy:
              raise SystemExit("collector reporting policy identity drift")
          if outputs["ReportingWorkGroupName"] != f"vevo-growthbook-reporting-{environment}":
              raise SystemExit("collector reporting workgroup identity drift")
          if outputs["ExperimentDatabaseName"] != f"vevo_growthbook_{environment}":
              raise SystemExit("collector experiment database identity drift")
          if not outputs["EventBucketName"].startswith(f"vevo-growthbook-{environment}-"):
              raise SystemExit("collector event bucket identity drift")

          candidate = json.load(open("candidate-task-definition.json", encoding="utf-8"))
          task_role_arn = str(candidate.get("taskRoleArn") or "")
          expected_role_arn = f"arn:aws:iam::{account}:role/{os.environ['EXPECTED_TASK_ROLE']}"
          if task_role_arn != expected_role_arn:
              raise SystemExit("candidate task role identity drift before policy attachment")
          values = {
              "POLICY_DATABASE": outputs["ExperimentDatabaseName"],
              "POLICY_EVENT_BUCKET": outputs["EventBucketName"],
              "POLICY_TASK_ROLE_ARN": task_role_arn,
              "POLICY_TASK_ROLE_NAME": os.environ["EXPECTED_TASK_ROLE"],
              "POLICY_WORKGROUP": outputs["ReportingWorkGroupName"],
              "REPORTING_POLICY_ARN": outputs["ReportingPolicyArn"],
          }
          for key, value in sorted(values.items()):
              if not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"invalid policy context value: {key}")
              print(f"{key}={value}")
          PY
          while IFS='=' read -r key value; do
            export "${key}=${value}"
          done < reporting-policy-context.env

          POLICY_DEFAULT_VERSION="$(aws iam get-policy \
            --policy-arn "${REPORTING_POLICY_ARN}" \
            --query 'Policy.DefaultVersionId' \
            --output text)"
          aws iam get-policy-version \
            --policy-arn "${REPORTING_POLICY_ARN}" \
            --version-id "${POLICY_DEFAULT_VERSION}" > reporting-policy.json
          python3 <<'PY'
          import json
          import os

          def as_set(value):
              rows = value if isinstance(value, list) else [value]
              return {str(row) for row in rows}

          account = os.environ["EXPECTED_ACCOUNT_ID"]
          region = os.environ["AWS_REGION"]
          bucket_arn = f"arn:aws:s3:::{os.environ['POLICY_EVENT_BUCKET']}"
          database = os.environ["POLICY_DATABASE"]
          expected = {
              "ListOnlyExperimentPrefixes": {
                  "actions": {"s3:ListBucket"},
                  "resources": {bucket_arn},
                  "condition": {"StringLike": {"s3:prefix": [
                      "experiment-events/raw/*",
                      "experiment-events/curated/*",
                      "athena-results/reporting/*",
                  ]}},
              },
              "LocateExperimentBucket": {
                  "actions": {"s3:GetBucketLocation"},
                  "resources": {bucket_arn},
              },
              "ReadRawExperimentEvents": {
                  "actions": {"s3:GetObject"},
                  "resources": {f"{bucket_arn}/experiment-events/raw/*"},
              },
              "PublishCuratedFactsAndReportingQueryResults": {
                  "actions": {"s3:GetObject", "s3:PutObject", "s3:AbortMultipartUpload"},
                  "resources": {
                      f"{bucket_arn}/experiment-events/curated/*",
                      f"{bucket_arn}/athena-results/reporting/*",
                  },
              },
              "RunReportingAthenaQueries": {
                  "actions": {
                      "athena:GetQueryExecution", "athena:GetQueryResults", "athena:GetWorkGroup",
                      "athena:StartQueryExecution", "athena:StopQueryExecution",
                  },
                  "resources": {
                      f"arn:aws:athena:{region}:{account}:workgroup/{os.environ['POLICY_WORKGROUP']}"
                  },
              },
              "ReadExperimentCatalog": {
                  "actions": {
                      "glue:GetDatabase", "glue:GetDatabases", "glue:GetPartition",
                      "glue:GetPartitions", "glue:GetTable", "glue:GetTables",
                  },
                  "resources": {
                      f"arn:aws:glue:{region}:{account}:catalog",
                      f"arn:aws:glue:{region}:{account}:database/{database}",
                      f"arn:aws:glue:{region}:{account}:table/{database}/*",
                  },
              },
          }
          document = json.load(open("reporting-policy.json", encoding="utf-8"))["PolicyVersion"]["Document"]
          if document.get("Version") != "2012-10-17":
              raise SystemExit("reporting policy version drift")
          statements = document.get("Statement") or []
          by_sid = {str(row.get("Sid") or ""): row for row in statements}
          if len(statements) != len(expected) or set(by_sid) != set(expected):
              raise SystemExit("reporting policy statement identity drift")
          for sid, contract in expected.items():
              statement = by_sid[sid]
              expected_keys = {"Sid", "Effect", "Action", "Resource"}
              if "condition" in contract:
                  expected_keys.add("Condition")
              if set(statement) != expected_keys or statement.get("Effect") != "Allow":
                  raise SystemExit(f"reporting policy statement shape drift: {sid}")
              if as_set(statement.get("Action")) != contract["actions"]:
                  raise SystemExit(f"reporting policy action drift: {sid}")
              if as_set(statement.get("Resource")) != contract["resources"]:
                  raise SystemExit(f"reporting policy resource drift: {sid}")
              if statement.get("Condition") != contract.get("condition"):
                  raise SystemExit(f"reporting policy condition drift: {sid}")
          print("REPORTING_POLICY_DOCUMENT_EXACT_OK")
          PY

          POLICY_ATTACHED_BY_RUN=false
          if ! aws iam list-attached-role-policies \
            --role-name "${POLICY_TASK_ROLE_NAME}" \
            --query 'AttachedPolicies[].PolicyArn' \
            --output text | tr '\t' '\n' | grep -Fxq "${REPORTING_POLICY_ARN}"; then
            aws iam attach-role-policy \
              --role-name "${POLICY_TASK_ROLE_NAME}" \
              --policy-arn "${REPORTING_POLICY_ARN}"
            POLICY_ATTACHED_BY_RUN=true
          fi
          POLICY_READBACK_OK=false
          for _ in $(seq 1 30); do
            if aws iam list-attached-role-policies \
              --role-name "${POLICY_TASK_ROLE_NAME}" \
              --query 'AttachedPolicies[].PolicyArn' \
              --output text | tr '\t' '\n' | grep -Fxq "${REPORTING_POLICY_ARN}"; then
              POLICY_READBACK_OK=true
              break
            fi
            sleep 2
          done
          if [[ "${POLICY_READBACK_OK}" != "true" ]]; then
            echo "Exact GrowthBook reporting policy attachment did not become readable" >&2
            exit 1
          fi
          {
            cat reporting-policy-context.env
            echo "POLICY_ATTACHED_BY_RUN=${POLICY_ATTACHED_BY_RUN}"
          } >> "${GITHUB_ENV}"
          echo "REPORTING_POLICY_ATTACHED_OK:${POLICY_TASK_ROLE_NAME}:${REPORTING_POLICY_ARN}:${POLICY_ATTACHED_BY_RUN}"

          CANDIDATE_TASK_DEFINITION="$(aws ecs register-task-definition \
            --cli-input-json file://candidate-task-definition.json \
            --region "${AWS_REGION}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          aws ecs describe-task-definition \
            --task-definition "${CANDIDATE_TASK_DEFINITION}" \
            --region "${AWS_REGION}" > candidate-task-definition-response.json

          python3 <<'PY' > network.json
          import json
          schedule = json.load(open("source-schedule-before.json", encoding="utf-8"))
          raw = schedule["Target"]["EcsParameters"]["NetworkConfiguration"]["awsvpcConfiguration"]
          value = {
              "awsvpcConfiguration": {
                  "subnets": raw.get("Subnets") or raw.get("subnets") or [],
                  "securityGroups": raw.get("SecurityGroups") or raw.get("securityGroups") or [],
                  "assignPublicIp": raw.get("AssignPublicIp") or raw.get("assignPublicIp") or "DISABLED",
              }
          }
          if len(value["awsvpcConfiguration"]["subnets"]) < 2:
              raise SystemExit("source schedule must expose at least two subnets")
          if not value["awsvpcConfiguration"]["securityGroups"]:
              raise SystemExit("source schedule must expose a security group")
          print(json.dumps(value))
          PY

          python3 <<'PY' > runtime.env
          import json
          import os

          stack = json.load(open("collector-stack.json", encoding="utf-8"))["Stacks"][0]
          if stack.get("StackStatus") != "UPDATE_COMPLETE":
              raise SystemExit(f"collector stack is not UPDATE_COMPLETE: {stack.get('StackStatus')}")
          parameters = {row["ParameterKey"]: row["ParameterValue"] for row in stack.get("Parameters") or []}
          outputs = {row["OutputKey"]: row["OutputValue"] for row in stack.get("Outputs") or []}
          if (
              parameters.get("Environment") != os.environ["RECONCILIATION_ENVIRONMENT"]
              or parameters.get("PublicRouteEnabled") != "true"
          ):
              raise SystemExit("collector stack is not the selected active environment boundary")
          required_outputs = {"EventBucketName", "ReportingPolicyArn"}
          if not required_outputs.issubset(outputs):
              raise SystemExit("collector stack is missing reconciliation outputs")

          schedule = json.load(open("source-schedule-before.json", encoding="utf-8"))
          ecs = schedule["Target"]["EcsParameters"]
          network = json.load(open("network.json", encoding="utf-8"))["awsvpcConfiguration"]
          task = json.load(open("candidate-task-definition-response.json", encoding="utf-8"))["taskDefinition"]
          container = task["containerDefinitions"][0]
          logs = (container.get("logConfiguration") or {}).get("options") or {}
          values = {
              "EVENT_BUCKET": outputs["EventBucketName"],
              "REPORTING_POLICY_ARN": outputs["ReportingPolicyArn"],
              "CLUSTER_ARN": schedule["Target"]["Arn"],
              "LAUNCH_TYPE": ecs.get("LaunchType") or "FARGATE",
              "PLATFORM_VERSION": ecs.get("PlatformVersion") or "LATEST",
              "ASSIGN_PUBLIC_IP": network["assignPublicIp"],
              "SUBNET_IDS": ",".join(network["subnets"]),
              "SECURITY_GROUP_IDS": ",".join(network["securityGroups"]),
              "CONTAINER_NAME": container["name"],
              "TASK_ROLE_ARN": task["taskRoleArn"],
              "EXECUTION_ROLE_ARN": task["executionRoleArn"],
              "LOG_GROUP": logs["awslogs-group"],
              "LOG_PREFIX": logs["awslogs-stream-prefix"],
          }
          for key, value in sorted(values.items()):
              if not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"invalid runtime value: {key}")
              print(f"{key}={value}")
          PY
          python3 <<'PY'
          import re

          expected = {
              "ASSIGN_PUBLIC_IP", "CLUSTER_ARN", "CONTAINER_NAME", "EVENT_BUCKET",
              "EXECUTION_ROLE_ARN", "LAUNCH_TYPE", "LOG_GROUP", "LOG_PREFIX",
              "PLATFORM_VERSION", "REPORTING_POLICY_ARN", "SECURITY_GROUP_IDS",
              "SUBNET_IDS", "TASK_ROLE_ARN",
          }
          rows = [row for row in open("runtime.env", encoding="utf-8").read().splitlines() if row]
          pairs = [row.split("=", 1) for row in rows]
          keys = [pair[0] for pair in pairs if len(pair) == 2]
          if len(pairs) != len(expected) or len(keys) != len(expected) or set(keys) != expected:
              raise SystemExit("runtime.env key set is not exact")
          if len(keys) != len(set(keys)):
              raise SystemExit("runtime.env contains duplicate keys")
          if any(not re.fullmatch(r"[A-Z][A-Z0-9_]*", key) or not value for key, value in pairs):
              raise SystemExit("runtime.env contains an invalid assignment")
          PY
          while IFS='=' read -r key value; do
            export "${key}=${value}"
          done < runtime.env
          cat runtime.env >> "${GITHUB_ENV}"
          {
            echo "SOURCE_TASK_DEFINITION=${SOURCE_TASK_DEFINITION}"
            echo "CANDIDATE_TASK_DEFINITION=${CANDIDATE_TASK_DEFINITION}"
            echo "IMAGE_DIGEST=${IMAGE_DIGEST}"
            echo "IMAGE_IDENTIFIER=${IMAGE_IDENTIFIER}"
          } >> "${GITHUB_ENV}"

          TASK_ROLE_NAME="${TASK_ROLE_ARN##*/}"
          aws iam list-attached-role-policies --role-name "${TASK_ROLE_NAME}" > task-role-policies.json
          python3 <<'PY'
          import json
          import os
          policies = {
              row["PolicyArn"]
              for row in json.load(open("task-role-policies.json", encoding="utf-8")).get("AttachedPolicies") or []
          }
          if os.environ["REPORTING_POLICY_ARN"] not in policies:
              raise SystemExit("VEVO task role is missing the exact GrowthBook reporting policy")
          PY

          echo "PREDEPLOY_CONTEXT_OK:instance-id=N/A:Fargate:private-ip=pending-task:service=${SCHEDULE_NAME}:path=${RUNTIME_PATH}:task-definition=${CANDIDATE_TASK_DEFINITION}:image=${IMAGE_IDENTIFIER}"

      - name: Run exact Fargate localhost and marker hard gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' > host-gate-overrides.json
          import json
          import os
          print(json.dumps({"containerOverrides": [{
              "name": os.environ["CONTAINER_NAME"],
              "command": ["/bin/bash", "/app/scripts/growthbook_reconcile_host_gate.sh"],
              "environment": [
                  {"name": "REPORT_PROJECT", "value": "vevo"},
                  {"name": "GROWTHBOOK_ENVIRONMENT", "value": os.environ["RECONCILIATION_ENVIRONMENT"]},
                  {"name": "GROWTHBOOK_RECONCILE_VERSION", "value": os.environ["IMAGE_DIGEST"]},
              ],
          }]}))
          PY
          aws ecs run-task \
            --cluster "${CLUSTER_ARN}" \
            --task-definition "${CANDIDATE_TASK_DEFINITION}" \
            --launch-type FARGATE \
            --platform-version "${PLATFORM_VERSION}" \
            --network-configuration file://network.json \
            --overrides file://host-gate-overrides.json \
            --group "${SCHEDULE_NAME}" \
            --started-by "vevo-growthbook-reconcile-host-${GITHUB_RUN_ID}" \
            --region "${AWS_REGION}" > host-gate-task.json
          HOST_TASK_ARN="$(python3 - <<'PY'
          import json
          run = json.load(open("host-gate-task.json", encoding="utf-8"))
          if run.get("failures") or len(run.get("tasks") or []) != 1:
              raise SystemExit(f"host gate failed to start: {run}")
          print(run["tasks"][0]["taskArn"])
          PY
          )"
          aws ecs wait tasks-stopped --cluster "${CLUSTER_ARN}" --tasks "${HOST_TASK_ARN}" --region "${AWS_REGION}"
          aws ecs describe-tasks --cluster "${CLUSTER_ARN}" --tasks "${HOST_TASK_ARN}" --region "${AWS_REGION}" > host-gate-state.json
          readarray -t HOST_VALUES < <(python3 - "${IMAGE_DIGEST}" <<'PY'
          import json
          import sys
          expected = sys.argv[1]
          task = json.load(open("host-gate-state.json", encoding="utf-8"))["tasks"][0]
          containers = task.get("containers") or []
