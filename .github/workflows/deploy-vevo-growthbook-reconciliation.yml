      - name: Read back exact schedule, role, monitoring, and unchanged source schedule
        shell: bash
        env:
          ENABLE_SCHEDULE: ${{ inputs.enable_schedule }}
        run: |
          set -euo pipefail
          aws scheduler get-schedule --name "${SCHEDULE_NAME}" --region "${AWS_REGION}" > deployed-schedule.json
          aws scheduler get-schedule --name "${SOURCE_SCHEDULE}" --region "${AWS_REGION}" > source-schedule-after.json
          aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --region "${AWS_REGION}" > deployed-stack.json
          aws cloudwatch describe-alarms \
            --alarm-names \
              "${SCHEDULE_NAME}-failure" \
              "${SCHEDULE_NAME}-missing-success" \
              "${SCHEDULE_NAME}-dlq" \
            --region "${AWS_REGION}" > deployed-alarms.json
          python3 <<'PY'
          import json
          import os

          before = json.load(open("source-schedule-before.json", encoding="utf-8"))
          after = json.load(open("source-schedule-after.json", encoding="utf-8"))
          if before != after:
              raise SystemExit("VEVO reporting source schedule changed during reconciliation deploy")

          schedule = json.load(open("deployed-schedule.json", encoding="utf-8"))
          expected_state = "ENABLED" if os.environ["ENABLE_SCHEDULE"] == "true" else "DISABLED"
          if schedule.get("Name") != os.environ["SCHEDULE_NAME"] or schedule.get("State") != expected_state:
              raise SystemExit("reconciliation schedule identity/state drift")
          if schedule.get("ScheduleExpression") != os.environ["SCHEDULE_EXPRESSION"]:
              raise SystemExit("reconciliation schedule expression drift")
          if schedule.get("ScheduleExpressionTimezone") != "Europe/Bratislava":
              raise SystemExit("reconciliation schedule timezone drift")
          target = schedule.get("Target") or {}
          ecs = target.get("EcsParameters") or {}
          if target.get("Arn") != os.environ["CLUSTER_ARN"]:
              raise SystemExit("reconciliation cluster drift")
          if ecs.get("TaskDefinitionArn") != os.environ["CANDIDATE_TASK_DEFINITION"]:
              raise SystemExit("reconciliation task definition drift")
          if ecs.get("Group") != os.environ["SCHEDULE_NAME"] or ecs.get("TaskCount") != 1:
              raise SystemExit("reconciliation ECS group/count drift")
          if ecs.get("EnableExecuteCommand") is not False:
              raise SystemExit("reconciliation execute-command must remain disabled")
          retry = target.get("RetryPolicy") or {}
          if retry != {"MaximumEventAgeInSeconds": 3600, "MaximumRetryAttempts": 2}:
              raise SystemExit("reconciliation retry policy drift")
          actual_input = json.loads(target.get("Input") or "{}")
          expected_input = {
              "containerOverrides": [{
                  "name": os.environ["CONTAINER_NAME"],
                  "command": ["/bin/bash", "-lc", "cd /app && python scripts/run_scheduled_growthbook_reconciliation.py"],
                  "environment": [
                      {"name": "REPORT_PROJECT", "value": "vevo"},
                      {"name": "GROWTHBOOK_ENVIRONMENT", "value": os.environ["RECONCILIATION_ENVIRONMENT"]},
                      {"name": "GROWTHBOOK_EVENT_BUCKET", "value": os.environ["EVENT_BUCKET"]},
                      {"name": "GROWTHBOOK_FACT_PUBLISH_ENABLED", "value": "true"},
                      {"name": "AWS_REGION", "value": os.environ["AWS_REGION"]},
                  ],
              }]
          }
          if actual_input != expected_input:
              raise SystemExit("reconciliation target override drift")

          stack = json.load(open("deployed-stack.json", encoding="utf-8"))["Stacks"][0]
          if stack.get("StackStatus") != "UPDATE_COMPLETE" and not stack.get("StackStatus", "").endswith("CREATE_COMPLETE"):
              raise SystemExit("reconciliation stack is not complete")
          outputs = {row["OutputKey"]: row["OutputValue"] for row in stack.get("Outputs") or []}
          if outputs.get("TargetTaskDefinitionArn") != os.environ["CANDIDATE_TASK_DEFINITION"]:
              raise SystemExit("reconciliation stack task output drift")
          alarms = json.load(open("deployed-alarms.json", encoding="utf-8")).get("MetricAlarms") or []
          if {row.get("AlarmName") for row in alarms} != {
              f"{os.environ['SCHEDULE_NAME']}-failure",
              f"{os.environ['SCHEDULE_NAME']}-missing-success",
              f"{os.environ['SCHEDULE_NAME']}-dlq",
          }:
              raise SystemExit("reconciliation alarms missing")
          PY
          echo "GROWTHBOOK_RECONCILIATION_SCHEDULE_READBACK_OK:${SCHEDULE_NAME}:${CANDIDATE_TASK_DEFINITION}:${ENABLE_SCHEDULE}"

      - name: Build sanitized deployment evidence
        shell: bash
        env:
          ENABLE_SCHEDULE: ${{ inputs.enable_schedule }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def integer(name):
              value = int(os.environ[name])
              if value < 0:
                  raise SystemExit(f"negative reconciliation evidence count: {name}")
              return value

          environment = os.environ["RECONCILIATION_ENVIRONMENT"]
          if environment not in {"preview", "production"}:
              raise SystemExit("reconciliation evidence environment drift")
          policy_attached_by_run = os.environ["POLICY_ATTACHED_BY_RUN"]
          if policy_attached_by_run not in {"true", "false"}:
              raise SystemExit("reconciliation policy attachment evidence drift")
          evidence = {
              "schema_version": 1,
              "evidence_type": "vevo_growthbook_reconciliation_deploy",
              "environment": environment,
              "observed_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "source_run_id": os.environ["GITHUB_RUN_ID"],
              "source_main_commit": os.environ["GITHUB_SHA"],
              "aws": {
                  "account_id": os.environ["EXPECTED_ACCOUNT_ID"],
                  "region": os.environ["AWS_REGION"],
                  "collector_stack": os.environ["COLLECTOR_STACK_NAME"],
                  "reconciliation_stack": os.environ["STACK_NAME"],
              },
              "source_runtime": {
                  "instance_id": "N/A:Fargate",
                  "service": os.environ["SOURCE_SCHEDULE"],
                  "task_definition": os.environ["SOURCE_TASK_DEFINITION"],
                  "source_schedule_unchanged": True,
              },
              "reporting_policy": {
                  "arn": os.environ["REPORTING_POLICY_ARN"],
                  "task_role": os.environ["POLICY_TASK_ROLE_ARN"],
                  "document_exactly_verified": True,
                  "attached_by_run": policy_attached_by_run == "true",
                  "attachment_readback_verified": True,
              },
              "host_gate": {
                  "instance_id": "N/A:Fargate",
                  "private_ip": os.environ["HOST_PRIVATE_IP"],
                  "service": os.environ["SCHEDULE_NAME"],
                  "task_id": os.environ["HOST_TASK_ID"],
                  "runtime_path": os.environ["RUNTIME_PATH"],
                  "localhost_health_verified": True,
                  "localhost_marker_verified": True,
              },
              "reconciliation": {
                  "task_definition": os.environ["CANDIDATE_TASK_DEFINITION"],
                  "image_digest": os.environ["IMAGE_DIGEST"],
                  "one_shot_task_id": os.environ["RECONCILIATION_TASK_ID"],
                  "one_shot_private_ip": os.environ["RECONCILIATION_PRIVATE_IP"],
                  "raw_events": integer("RAW_EVENTS"),
                  "device_facts": integer("DEVICE_FACTS"),
                  "performance_facts": integer("PERFORMANCE_FACTS"),
                  "quality_reports": integer("QUALITY_REPORTS"),
                  "curated_fact_publish_verified": True,
              },
              "schedule": {
                  "name": os.environ["SCHEDULE_NAME"],
                  "expression": os.environ["SCHEDULE_EXPRESSION"],
                  "timezone": "Europe/Bratislava",
                  "enabled": os.environ["ENABLE_SCHEDULE"] == "true",
                  "dlq": os.environ["DLQ_NAME"],
                  "failure_alarm": f"{os.environ['SCHEDULE_NAME']}-failure",
                  "missing_success_alarm": f"{os.environ['SCHEDULE_NAME']}-missing-success",
                  "dlq_alarm": f"{os.environ['SCHEDULE_NAME']}-dlq",
              },
              "boundaries": {
                  "raw_event_delete_performed": False,
                  "collector_mutated": False,
                  "growthbook_experiment_mutated": False,
                  "gtm_mutated": False,
                  "meta_ads_mutated": False,
                  "biznisweb_mutated": False,
                  "price_product_cart_checkout_or_order_mutated": False,
              },
              "contains_raw_aws_payloads": False,
              "contains_cloudwatch_messages": False,
              "contains_event_device_customer_or_order_ids": False,
              "contains_credentials": False,
          }
          output = Path(os.environ["EVIDENCE_FILE"])
          output.write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"GROWTHBOOK_RECONCILIATION_EVIDENCE_OK:{output}")
          PY

      - name: Upload sanitized deployment evidence only
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ format('vevo-growthbook-{0}-reconciliation-deploy', inputs.environment) }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Deployment summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## VEVO GrowthBook ${RECONCILIATION_ENVIRONMENT} reconciliation"
            echo "- Instance: \`N/A (ECS/Fargate)\`"
            echo "- Service: \`${SCHEDULE_NAME}\`"
            echo "- Runtime: \`${RUNTIME_PATH}\`"
            echo "- Host task/IP: \`${HOST_TASK_ID:-not-run}\` / \`${HOST_PRIVATE_IP:-not-run}\`"
            echo "- Reconcile task/IP: \`${RECONCILIATION_TASK_ID:-not-run}\` / \`${RECONCILIATION_PRIVATE_IP:-not-run}\`"
            echo "- Image: \`${IMAGE_IDENTIFIER:-not-resolved}\`"
            echo "- Raw/device/performance/quality: \`${RAW_EVENTS:-not-run}\` / \`${DEVICE_FACTS:-not-run}\` / \`${PERFORMANCE_FACTS:-not-run}\` / \`${QUALITY_REPORTS:-not-run}\`"
            echo "- GrowthBook experiment allocation: unchanged"
            echo "- GTM: unchanged"
          } >> "${GITHUB_STEP_SUMMARY}"
