          python3 - "${IMAGE_DIGEST}" <<'PY'
          import json
          import os
          import sys
          digest = sys.argv[1]
          messages = [row.get("message", "") for row in json.load(open("host-gate-logs.json", encoding="utf-8")).get("events") or []]
          required = {
              f"GROWTHBOOK_RECONCILE_LOCALHOST_HEALTH_OK:{os.environ['RECONCILIATION_ENVIRONMENT']}:{digest}",
              f"GROWTHBOOK_RECONCILE_LOCALHOST_MARKER_OK:/app:{digest}",
          }
          raise SystemExit(0 if all(any(marker in message for message in messages) for marker in required) else 1)
          PY
            then
              HOST_LOG_READY=true
              break
            fi
            sleep 2
          done
          if [[ "${HOST_LOG_READY}" != "true" ]]; then
            echo "Host-gate CloudWatch markers did not arrive within 60 seconds" >&2
            exit 1
          fi
          python3 - "${IMAGE_DIGEST}" <<'PY'
          import json
          import os
          import sys
          digest = sys.argv[1]
          messages = [row.get("message", "") for row in json.load(open("host-gate-logs.json", encoding="utf-8")).get("events") or []]
          required = {
              f"GROWTHBOOK_RECONCILE_LOCALHOST_HEALTH_OK:{os.environ['RECONCILIATION_ENVIRONMENT']}:{digest}",
              f"GROWTHBOOK_RECONCILE_LOCALHOST_MARKER_OK:/app:{digest}",
          }
          missing = sorted(marker for marker in required if not any(marker in message for message in messages))
          if missing:
              raise SystemExit(f"host gate markers missing: {missing}")
          PY
          {
