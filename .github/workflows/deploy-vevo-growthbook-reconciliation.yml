          aws ecs describe-tasks --cluster "${CLUSTER_ARN}" --tasks "${RECONCILIATION_TASK_ARN}" --region "${AWS_REGION}" > reconciliation-state.json
          readarray -t RECONCILIATION_VALUES < <(python3 - "${IMAGE_DIGEST}" <<'PY'
          import json
