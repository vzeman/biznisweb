              raise SystemExit("one-shot reconciliation image digest drift")
          details = [row for attachment in task.get("attachments") or [] for row in attachment.get("details") or []]
          private_ip = next((row.get("value") for row in details if row.get("name") == "privateIPv4Address"), "")
          if not private_ip:
