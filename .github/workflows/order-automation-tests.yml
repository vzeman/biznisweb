name: Order Automation Regression

on:
  pull_request:
    paths:
      - '*invoice*.py'
      - '*creditnote*.py'
      - 'unpaid_order_cancellation*.py'
      - 'order_status_safety.py'
      - 'order_status_identity.py'
      - 'export_orders.py'
      - 'operations_inventory.py'
      - '*operations_dashboard.py'
      - 'production_board.py'
      - 'scripts/*vevo*board*.py'
      - 'scripts/vevo_operations_host_gate.py'
      - 'live_dashboard_server.py'
      - 'picking_print_batches.py'
      - 'scripts/*picking*batch*.py'
      - 'manual_settlement.py'
      - 'scripts/record_verified_manual_settlement.py'
      - 'order_inventory.py'
      - 'api_read_backoff.py'
      - 'daily_report_runner.py'
      - requirements-runtime-control.txt
      - scripts/reporting_runtime_binding.py
      - scripts/reporting_readiness.py
      - scripts/deploy_vevo_report.py
      - scripts/reporting_identity_probe.py
      - scripts/reporting_migration_host_gate.py
      - scripts/dashboard_routing_host_gate.py
      - scripts/vevo_report_image_release.py
      - scripts/vevo_report_image_host.py
      - scripts/reporting_image_release_policy.py
      - scripts/reporting_image_release_lease.py
      - .github/workflows/deploy-vevo-report.yml
      - scripts/bootstrap_reporting_runtime.py
      - scripts/validate_growthbook_aa_infra_health_evidence.py
      - projects/vevo/reporting_runtime_policy.json
      - .github/workflows/monitor-vevo-growthbook-production-aa-infra.yml
      - .github/workflows/check-vevo-growthbook-production-aa-window.yml
      - .github/workflows/check-vevo-growthbook-production-cta-window.yml
      - .github/workflows/check-vevo-growthbook-production-cta-safety.yml
      - .github/workflows/build-vevo-growthbook-production-cta-final-snapshot.yml
      - 'reporting_core/**'
      - 'projects/*/settings.json'
      - 'scripts/*order_automation*.py'
      - 'scripts/seed_invoice_backfill.py'
      - 'scripts/restore_verified_fulfillment.py'
      - 'scripts/verify_invoice_backfill.py'
      - 'scripts/verify_invoice_discovery.py'
      - 'scripts/verify_invoice_post_recovery.py'
      - 'scripts/retry_seeded_invoice.py'
      - 'scripts/deploy_creditnote_automations.py'
      - 'scripts/creditnote_automation_host_gate.py'
      - 'scripts/reporting_guard_identity_probe.py'
      - '.github/workflows/deploy-creditnote-automations.yml'
      - 'scripts/reconcile_reviewed_invoice_outcomes.py'
      - 'scripts/close_reviewed_uncollected_obligation.py'
      - 'tests/**'
      - '.github/workflows/order-automation-tests.yml'
      - '.github/workflows/deploy-order-automations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify invoice, status and deployment failure boundaries
        run: >-
          python -m unittest
          tests.test_invoice_generation tests.test_invoice_automation_state tests.test_manual_settlement tests.test_manual_settlement_recovery tests.test_reviewed_invoice_obligations tests.test_reviewed_invoice_runtime tests.test_reviewed_uncollected_closure
          tests.test_order_status_safety tests.test_unpaid_order_cancellation
          tests.test_order_status_identity tests.test_status_identity_integration tests.test_explicit_target_integration
          tests.test_reporting_runtime_binding tests.test_reporting_runtime_binding_review tests.test_growthbook_aa_infra_health_evidence tests.test_growthbook_aa_infra_health_workflow tests.test_growthbook_aa_infra_health_log_cli
          tests.test_growthbook_aa_window_checkpoint_workflow tests.test_growthbook_cta_window_checkpoint_workflow tests.test_growthbook_managed_quality_source
          tests.test_reporting_migration_host_gate tests.test_vevo_report_deployment tests.test_vevo_bootstrap_recovery tests.test_reporting_readiness tests.test_managed_report_independent_review tests.test_reporting_environment_order_review
          tests.test_order_inventory
          tests.test_api_read_backoff
          tests.test_seeded_invoice_retry tests.test_reviewed_invoice_reconciliation
          tests.test_creditnote_storno_runner tests.test_creditnote_automation_deployment
          tests.test_creditnote_storno_guard tests.test_creditnote_export tests.test_report_status_identity tests.test_vevo_report_alarm_binding tests.test_daily_report_email tests.test_creditnote_release_observer
          tests.test_creditnote_automation_context tests.test_automation_runner_health
          tests.test_restore_verified_fulfillment tests.test_invoice_backfill_verification tests.test_invoice_discovery_verification tests.test_invoice_post_recovery_verification tests.test_invoice_backfill_seed tests.test_order_automation_audit tests.test_order_automation_deployment
          tests.test_production_board tests.test_vevo_operations_dashboard tests.test_roy_operations_dashboard tests.test_roy_picking_lists_pdf tests.test_live_dashboard_auth tests.test_live_dashboard_maintenance
          tests.test_picking_print_batches
          tests.test_operations_refresh
          tests.test_vevo_reporting_country_policy tests.test_vevo_localized_product_costs tests.test_vevo_zero_cost_services tests.test_roy_reporting_policies tests.test_roy_revenue_reconciliation tests.test_order_revenue_reconciliation tests.test_compensation_revenue_reconciliation
          tests.test_ads_measurement tests.test_live_report_quality_gate tests.test_vevo_report_image_release tests.test_reporting_image_release_policy tests.test_roy_report_image_release
          tests.test_partial_credit_adjustments tests.test_cfo_credit_adjustments tests.test_refund_status_population tests.test_reporting_financial_adjustments tests.test_report_period_failure_diagnostics tests.test_report_summary_advertising_language tests.test_reporting_marketing_semantics tests.test_live_dashboard_marketing_semantics tests.test_customer_lifetime_credit_aggregation tests.test_report_dashboard_image_release
          tests.test_cost_estimate_publication_policy
