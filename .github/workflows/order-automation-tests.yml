name: Order Automation Regression

on:
  pull_request:
    paths:
      - '*invoice*.py'
      - '*creditnote*.py'
      - 'unpaid_order_cancellation*.py'
      - 'order_status_safety.py'
      - 'daily_report_runner.py'
      - 'reporting_core/**'
      - 'projects/*/settings.json'
      - 'scripts/*order_automation*.py'
      - 'tests/**'
      - '.github/workflows/order-automation-tests.yml'
      - '.github/workflows/deploy-order-automations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify invoice, status and deployment failure boundaries
        run: >-
          python -m unittest
          tests.test_invoice_generation tests.test_invoice_automation_state
          tests.test_order_status_safety tests.test_unpaid_order_cancellation
          tests.test_creditnote_storno_guard tests.test_creditnote_export
          tests.test_creditnote_automation_context tests.test_automation_runner_health
          tests.test_restore_verified_fulfillment tests.test_invoice_backfill_seed tests.test_order_automation_audit tests.test_order_automation_deployment
