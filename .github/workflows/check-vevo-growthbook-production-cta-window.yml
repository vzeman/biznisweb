name: Check VEVO GrowthBook Production CTA Window

on:
  schedule:
    # GitHub Actions cron is UTC. The pre-AWS gate admits only the slot that is
    # 04:30 Europe/Bratislava for the current checkpoint date.
    - cron: '30 2 * * *'
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      confirm_checkpoint:
        description: Type true to run the outcome-blind read-only CTA assignment checkpoint
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: vevo-growthbook-production-cta-window-checkpoint
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  EXPECTED_ACCOUNT_ID: '919341186960'
  COLLECTOR_STACK: vevo-growthbook-production
  RECONCILIATION_STACK: vevo-growthbook-reconciliation-production
  EXPECTED_SERVICE: vevo-growthbook-reconcile-production
  EXPECTED_SOURCE_SCHEDULE: vevo-daily-report-email
  EXPECTED_DATABASE: vevo_growthbook_production
  EXPECTED_WORKGROUP: vevo-growthbook-reporting-production
  EXPECTED_RUNTIME_PATH: /app
  CTA_WINDOW_MANIFEST: projects/vevo/growthbook_cta_measurement_window.json
  DEPLOY_EVIDENCE: projects/vevo/growthbook_production_reconciliation_deploy_evidence.json
  EVIDENCE_FILE: vevo-growthbook-cta-window-checkpoint.json
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-outcome-blind-sample:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require exact read-only checkpoint confirmation
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM_CHECKPOINT: ${{ inputs.confirm_checkpoint }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            workflow_dispatch)
              [[ "${CONFIRM_CHECKPOINT}" == 'true' ]]
              ;;
            schedule)
              ;;
            *)
              echo "unsupported CTA checkpoint event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Checkout exact main commit
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate outcome-blind checkpoint gate before AWS credentials
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_growthbook_cta_window_checkpoint
          python scripts/validate_growthbook_workspace.py
          python scripts/validate_growthbook_cta_measurement_window.py
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime, time, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from scripts.validate_growthbook_cta_measurement_window import checkpoint_boundaries, expected_measurement_window

          root = Path('.')
          manifest = json.loads(Path(os.environ['CTA_WINDOW_MANIFEST']).read_text(encoding='utf-8'))
          event_name = os.environ['EVENT_NAME']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('RUN_CHECKPOINT=false\n')
          if manifest.get('status') != 'cta_running_outcome_blind_checkpoint_pending':
              if event_name == 'schedule':
                  print('PRODUCTION_CTA_WINDOW_SCHEDULE_SKIP:reason=window-not-open:aws=false')
                  raise SystemExit(0)
              raise SystemExit('CTA outcome-blind window is not open')
          activation = json.loads((root / 'projects/vevo/growthbook_cta_activation.json').read_text(encoding='utf-8'))
          start_observation = json.loads((root / 'projects/vevo/growthbook_cta_activation_observation.json').read_text(encoding='utf-8'))
          sample = json.loads((root / 'projects/vevo/growthbook_cta_sample_plan.json').read_text(encoding='utf-8'))
          contract = json.loads((root / 'projects/vevo/growthbook_cta_decision_contract.json').read_text(encoding='utf-8'))
          reconciliation = json.loads(Path(os.environ['DEPLOY_EVIDENCE']).read_text(encoding='utf-8'))
          workspace = json.loads((root / 'projects/vevo/growthbook_workspace.json').read_text(encoding='utf-8'))
          window = manifest['measurement_window']
          if manifest['assignment_stop'] != {
              'status': 'not_open',
              'manual_review_allowed': False,
              'automatic_stop_allowed': False,
              'observation_path': 'projects/vevo/growthbook_cta_assignment_stop_observation.json',
              'observation_sha256': None,
              'assignment_ended_at_utc': None,
          }:
              raise SystemExit('CTA assignment stop boundary opened before stopping rule')
          boundaries = manifest['release_boundaries']
          if boundaries.get('read_only_checkpoint_allowed') is not True:
              raise SystemExit('CTA read-only checkpoint gate is closed')
          forbidden = set(boundaries) - {'main_only', 'read_only_checkpoint_allowed'}
          if boundaries.get('main_only') is not True or any(boundaries[key] is not False for key in forbidden):
              raise SystemExit('CTA mutation/outcome/winner boundary drift')
          experiments = {row['tracking_key']: row for row in workspace['experiments']}
          aa = experiments['vevo-sk-aa-001']
          cta = experiments['vevo-sk-product-cta-color-001']
          if (
              workspace['workspace']['production_allocation_percent'] != 100
              or aa['status'] != 'stopped_production_aa_pass_verified'
              or aa['production_allocation_percent'] != 0
          ):
              raise SystemExit('A/A must remain stopped during CTA checkpointing')
          if (
              workspace.get('state') != 'production_cta_running_activation_verified_pro_quantiles_verified'
              or cta['status'] != 'running_production_cta_only'
              or cta['production_allocation_percent'] != 100
          ):
              raise SystemExit('CTA running Production allocation drift')

          expected = expected_measurement_window(
              activation, start_observation, sample, contract, reconciliation
          )
          now = datetime.now(UTC)
          checkpoint_history = window['checkpoint_history']

          if event_name == 'workflow_dispatch':
              checkpoint_index = len(checkpoint_history) + 1
          elif event_name == 'schedule':
              local_timezone = ZoneInfo(expected['timezone'])
              now_local = now.astimezone(local_timezone)
              scheduled_local = datetime.combine(
                  now_local.date(), time(hour=4, minute=30), tzinfo=local_timezone
              )
              scheduled_utc = scheduled_local.astimezone(UTC)
              expected_schedule = (
                  f'{scheduled_utc.minute} {scheduled_utc.hour} * * *'
              )
              if os.environ['EVENT_SCHEDULE'] != expected_schedule:
                  print('PRODUCTION_CTA_WINDOW_SCHEDULE_SKIP:reason=wrong-dst-slot:aws=false')
                  raise SystemExit(0)
              first_due = datetime.fromisoformat(
                  expected['earliest_checkpoint_due_local']
              )
              checkpoint_index = (now_local.date() - first_due.date()).days + 1
              if checkpoint_index < 1:
                  print('PRODUCTION_CTA_WINDOW_SCHEDULE_SKIP:reason=before-first-due:aws=false')
                  raise SystemExit(0)
              maximum_date = datetime.fromisoformat(
                  expected['maximum_through_utc'].replace('Z', '+00:00')
              ).astimezone(local_timezone).date()
              if now_local.date() > maximum_date:
                  print('PRODUCTION_CTA_WINDOW_SCHEDULE_SKIP:reason=after-maximum-due:aws=false')
                  raise SystemExit(0)
              recorded_indexes = {
                  row['evidence']['window']['checkpoint_index']
                  for row in checkpoint_history
              }
              if checkpoint_index in recorded_indexes:
                  print('PRODUCTION_CTA_WINDOW_SCHEDULE_SKIP:reason=already-recorded:aws=false')
                  raise SystemExit(0)
          else:
              raise SystemExit(f'unsupported CTA checkpoint event: {event_name}')

          candidate_through, due, _, _ = checkpoint_boundaries(expected, checkpoint_index)
          if not due.astimezone(UTC) <= now < (due + timedelta(days=1)).astimezone(UTC):
              raise SystemExit('outcome-blind CTA checkpoint is outside its daily gate')
          temporary = Path(os.environ['RUNNER_TEMP']) / f"vevo-cta-window-{os.environ['GITHUB_RUN_ID']}"
          temporary.mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('RUN_CHECKPOINT=true\n')
              handle.write(f'CHECKPOINT_INDEX={checkpoint_index}\n')
              handle.write(f'CTA_STARTED_AT_UTC={expected["assignment_started_at_utc"]}\n')
              handle.write(f'CANDIDATE_THROUGH_UTC={candidate_through.astimezone(UTC).isoformat(timespec="seconds").replace("+00:00", "Z")}\n')
              handle.write(f'CHECKPOINT_DUE_LOCAL={due.isoformat(timespec="seconds")}\n')
              handle.write(f'TARGET_TOTAL_SAMPLE={expected["target_total_sample"]}\n')
              handle.write(f'TEMP_CHECKPOINT_DIR={temporary}\n')
          print('PRODUCTION_CTA_WINDOW_LOCAL_GATE_OK:assignment=running:arm-read=false:outcome-read=false:mutation=none')
          PY

      - name: Configure AWS credentials for bounded read-only checkpoint
        if: ${{ env.RUN_CHECKPOINT == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read exact stack schedule and reconciliation task identity
        if: ${{ env.RUN_CHECKPOINT == 'true' }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "${ACCOUNT_ID}" == "${EXPECTED_ACCOUNT_ID}" ]]
          ACTUAL_DEPLOY_SHA="$(sha256sum "${DEPLOY_EVIDENCE}" | cut -d' ' -f1)"
          [[ "${ACTUAL_DEPLOY_SHA}" == '21fb2aab84f4839ccff04ca1a479e2ba2de4fef516a86b748a061957459baacb' ]]
          aws cloudformation describe-stacks --stack-name "${COLLECTOR_STACK}" --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/collector-stack.json"
          aws cloudformation describe-stacks --stack-name "${RECONCILIATION_STACK}" --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/reconciliation-stack.json"
          aws scheduler get-schedule --name "${EXPECTED_SERVICE}" --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/schedule.json"
          aws scheduler get-schedule --name "${EXPECTED_SOURCE_SCHEDULE}" --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/source-schedule.json"
          python - <<'PY' > "${TEMP_CHECKPOINT_DIR}/runtime.env"
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['TEMP_CHECKPOINT_DIR'])
          collector = json.load(open(root / 'collector-stack.json', encoding='utf-8'))['Stacks'][0]
          reconciliation = json.load(open(root / 'reconciliation-stack.json', encoding='utf-8'))['Stacks'][0]
          schedule = json.load(open(root / 'schedule.json', encoding='utf-8'))
          source = json.load(open(root / 'source-schedule.json', encoding='utf-8'))
          if collector.get('StackStatus') != 'UPDATE_COMPLETE' or reconciliation.get('StackStatus') != 'UPDATE_COMPLETE':
              raise SystemExit('Production GrowthBook stack state drift')
          collector_outputs = {row['OutputKey']: row['OutputValue'] for row in collector.get('Outputs') or []}
          reconciliation_outputs = {row['OutputKey']: row['OutputValue'] for row in reconciliation.get('Outputs') or []}
          reconciliation_parameters = {row['ParameterKey']: row['ParameterValue'] for row in reconciliation.get('Parameters') or []}
          if (
              collector_outputs.get('ExperimentDatabaseName') != os.environ['EXPECTED_DATABASE']
              or collector_outputs.get('ReportingWorkGroupName') != os.environ['EXPECTED_WORKGROUP']
              or reconciliation_outputs.get('ScheduleName') != os.environ['EXPECTED_SERVICE']
              or reconciliation_outputs.get('ScheduleState') != 'ENABLED'
          ):
              raise SystemExit('Production checkpoint stack output drift')
          if (
              schedule.get('Name') != os.environ['EXPECTED_SERVICE']
              or schedule.get('State') != 'ENABLED'
              or schedule.get('ScheduleExpression') != 'cron(45 3 * * ? *)'
              or schedule.get('ScheduleExpressionTimezone') != 'Europe/Bratislava'
              or schedule.get('FlexibleTimeWindow') != {'Mode': 'OFF'}
              or schedule.get('Target', {}).get('Arn') != reconciliation_parameters.get('ClusterArn')
              or schedule.get('Target', {}).get('EcsParameters', {}).get('TaskDefinitionArn') != reconciliation_outputs.get('TargetTaskDefinitionArn')
              or schedule.get('Target', {}).get('EcsParameters', {}).get('Group') != os.environ['EXPECTED_SERVICE']
              or schedule.get('Target', {}).get('EcsParameters', {}).get('TaskCount') != 1
              or schedule.get('Target', {}).get('EcsParameters', {}).get('EnableExecuteCommand') is not False
          ):
              raise SystemExit('Production reconciliation schedule drift')
          target = schedule.get('Target') or {}
          if (
              target.get('RoleArn') != reconciliation_outputs.get('SchedulerRoleArn')
              or target.get('DeadLetterConfig') != {'Arn': reconciliation_outputs.get('DeadLetterQueueArn')}
              or target.get('RetryPolicy') != {'MaximumEventAgeInSeconds': 3600, 'MaximumRetryAttempts': 2}
          ):
              raise SystemExit('Production reconciliation schedule delivery boundary drift')
          schedule_input = json.loads(target.get('Input') or '{}')
          overrides = schedule_input.get('containerOverrides') or []
          if len(overrides) != 1:
              raise SystemExit('Production reconciliation schedule input drift')
          override = overrides[0]
          if (
              override.get('command') != ['/bin/bash', '-lc', 'cd /app && python scripts/run_scheduled_growthbook_reconciliation.py']
              or override.get('environment') != [
                  {'name': 'REPORT_PROJECT', 'value': 'vevo'},
                  {'name': 'GROWTHBOOK_ENVIRONMENT', 'value': 'production'},
                  {'name': 'GROWTHBOOK_EVENT_BUCKET', 'value': collector_outputs.get('EventBucketName')},
                  {'name': 'GROWTHBOOK_FACT_PUBLISH_ENABLED', 'value': 'true'},
                  {'name': 'AWS_REGION', 'value': os.environ['AWS_REGION']},
              ]
              or not override.get('name')
          ):
              raise SystemExit('Production reconciliation scheduled command drift')
          if (
              source.get('Name') != os.environ['EXPECTED_SOURCE_SCHEDULE']
              or source.get('State') != 'ENABLED'
              or source.get('Target', {}).get('Arn') != reconciliation_parameters.get('ClusterArn')
              or not str(source.get('Target', {}).get('EcsParameters', {}).get('TaskDefinitionArn') or '').endswith('vevo-reporting-daily:33')
          ):
              raise SystemExit('source reporting schedule drift')
          values = {
              'RECONCILIATION_CLUSTER_ARN': reconciliation_parameters['ClusterArn'],
              'PRODUCTION_DATABASE': collector_outputs['ExperimentDatabaseName'],
              'PRODUCTION_WORKGROUP': collector_outputs['ReportingWorkGroupName'],
              'RECONCILIATION_TASK_DEFINITION_ARN': reconciliation_outputs['TargetTaskDefinitionArn'],
              'RECONCILIATION_CONTAINER_NAME': override['name'],
              'RECONCILIATION_SCHEDULER_ROLE_ARN': reconciliation_outputs['SchedulerRoleArn'],
          }
          for key, value in values.items():
              print(f'{key}={value}')
          PY
          cat "${TEMP_CHECKPOINT_DIR}/runtime.env" >> "${GITHUB_ENV}"
          set -a
          source "${TEMP_CHECKPOINT_DIR}/runtime.env"
          set +a

          aws ecs describe-task-definition --task-definition "${RECONCILIATION_TASK_DEFINITION_ARN}" --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/task-definition.json"
          python - <<'PY' > "${TEMP_CHECKPOINT_DIR}/task-definition.env"
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['TEMP_CHECKPOINT_DIR'])
          definition = json.loads((root / 'task-definition.json').read_text(encoding='utf-8'))['taskDefinition']
          containers = definition.get('containerDefinitions') or []
          if (
              definition.get('taskDefinitionArn') != os.environ['RECONCILIATION_TASK_DEFINITION_ARN']
              or len(containers) != 1
              or containers[0].get('name') != os.environ['RECONCILIATION_CONTAINER_NAME']
          ):
              raise SystemExit('reconciliation task-definition identity drift')
          container = containers[0]
          expected_image = json.loads(Path(os.environ['DEPLOY_EVIDENCE']).read_text(encoding='utf-8'))['reconciliation']['image_digest']
          if not str(container.get('image') or '').endswith('@' + expected_image):
              raise SystemExit('reconciliation task-definition image drift')
          if container.get('workingDirectory') not in (None, os.environ['EXPECTED_RUNTIME_PATH']):
              raise SystemExit('reconciliation runtime path drift')
          log_options = (container.get('logConfiguration') or {}).get('options') or {}
          log_group = log_options.get('awslogs-group')
          if not log_group:
              raise SystemExit('reconciliation log group missing')
          print(f'RECONCILIATION_TASK_DEFINITION={os.environ["RECONCILIATION_TASK_DEFINITION_ARN"].rsplit("/", 1)[-1]}')
          print(f'RECONCILIATION_IMAGE_DIGEST={expected_image}')
          print(f'RECONCILIATION_LOG_GROUP={log_group}')
          PY
          cat "${TEMP_CHECKPOINT_DIR}/task-definition.env" >> "${GITHUB_ENV}"
          set -a
          source "${TEMP_CHECKPOINT_DIR}/task-definition.env"
          set +a

          python - <<'PY' > "${TEMP_CHECKPOINT_DIR}/checkpoint-window.env"
          import os
          from datetime import datetime, timedelta, timezone

          lower = datetime.fromisoformat(os.environ['CHECKPOINT_DUE_LOCAL']).astimezone(timezone.utc)
          upper = lower + timedelta(hours=2)
          values = {
              'CHECKPOINT_START_UTC': lower.isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'CHECKPOINT_END_UTC': upper.isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'CHECKPOINT_START_MS': str(int(lower.timestamp() * 1000)),
              'CHECKPOINT_END_MS': str(int(upper.timestamp() * 1000)),
          }
          for key, value in values.items():
              print(f'{key}={value}')
          PY
          set -a
          source "${TEMP_CHECKPOINT_DIR}/checkpoint-window.env"
          set +a
          aws logs filter-log-events \
            --log-group-name "${RECONCILIATION_LOG_GROUP}" \
            --filter-pattern '"GROWTHBOOK_SCHEDULED_RECONCILIATION_OK:"' \
            --start-time "${CHECKPOINT_START_MS}" \
            --end-time "${CHECKPOINT_END_MS}" \
            --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/success-events.json"
          aws logs filter-log-events \
            --log-group-name "${RECONCILIATION_LOG_GROUP}" \
            --filter-pattern '"GROWTHBOOK_SCHEDULED_RECONCILIATION_FAILURE:"' \
            --start-time "${CHECKPOINT_START_MS}" \
            --end-time "${CHECKPOINT_END_MS}" \
            --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/failure-events.json"
          aws cloudtrail lookup-events \
            --lookup-attributes AttributeKey=EventName,AttributeValue=RunTask \
            --start-time "${CHECKPOINT_START_UTC}" \
            --end-time "${CHECKPOINT_END_UTC}" \
            --max-items 500 \
            --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/cloudtrail.json"
          python - <<'PY' > "${TEMP_CHECKPOINT_DIR}/selected-marker.env"
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ['TEMP_CHECKPOINT_DIR'])
          successes = json.loads((root / 'success-events.json').read_text(encoding='utf-8')).get('events') or []
          failures = json.loads((root / 'failure-events.json').read_text(encoding='utf-8')).get('events') or []
          if failures or len(successes) != 1:
              raise SystemExit(
                  f'expected one CTA checkpoint success marker and zero failure markers, found {len(successes)}/{len(failures)}'
              )
          stream = str(successes[0].get('logStreamName') or '')
          task_id = stream.rsplit('/', 1)[-1]
          if re.fullmatch(r'[0-9a-f]{32}', task_id) is None:
              raise SystemExit('CTA checkpoint success-marker task ID is invalid')

          matching = []
          for row in json.loads((root / 'cloudtrail.json').read_text(encoding='utf-8')).get('Events') or []:
              raw = row.get('CloudTrailEvent')
              if not isinstance(raw, str):
                  continue
              try:
                  detail = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              identity = detail.get('userIdentity') or {}
              issuer = ((identity.get('sessionContext') or {}).get('sessionIssuer') or {})
              request = detail.get('requestParameters') or {}
              requested_definition = str(request.get('taskDefinition') or '')
              serialized = json.dumps(detail, sort_keys=True, separators=(',', ':'))
              if (
                  detail.get('eventSource') == 'ecs.amazonaws.com'
                  and detail.get('eventName') == 'RunTask'
                  and request.get('group') == os.environ['EXPECTED_SERVICE']
                  and requested_definition in {
                      os.environ['RECONCILIATION_TASK_DEFINITION_ARN'],
                      os.environ['RECONCILIATION_TASK_DEFINITION_ARN'].rsplit('/', 1)[-1],
                  }
                  and (
                      identity.get('invokedBy') == 'scheduler.amazonaws.com'
                      or issuer.get('arn') == os.environ['RECONCILIATION_SCHEDULER_ROLE_ARN']
                  )
                  and task_id in serialized
              ):
                  matching.append(detail)
          if len(matching) != 1:
              raise SystemExit(f'expected one exact Scheduler CloudTrail RunTask event, found {len(matching)}')
          (root / 'selected-cloudtrail-event.json').write_text(
              json.dumps(matching[0], sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          print(f'RECONCILIATION_TASK_ID={task_id}')
          print(f'RECONCILIATION_LOG_STREAM={stream}')
          PY
          set -a
          source "${TEMP_CHECKPOINT_DIR}/selected-marker.env"
          set +a
          aws ecs describe-tasks \
            --cluster "${RECONCILIATION_CLUSTER_ARN}" \
            --tasks "${RECONCILIATION_TASK_ID}" \
            --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/tasks.json"
          python - <<'PY' > "${TEMP_CHECKPOINT_DIR}/selected-task.env"
          import ipaddress
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          root = Path(os.environ['TEMP_CHECKPOINT_DIR'])
          lower = datetime.fromisoformat(os.environ['CHECKPOINT_START_UTC'].replace('Z', '+00:00')).timestamp()
          upper = datetime.fromisoformat(os.environ['CHECKPOINT_END_UTC'].replace('Z', '+00:00')).timestamp()
          exact_task = None
          for task in json.loads((root / 'tasks.json').read_text(encoding='utf-8')).get('tasks') or []:
              started_at = task.get('startedAt')
              started_epoch = datetime.fromisoformat(started_at.replace('Z', '+00:00')).timestamp() if started_at else -1
              if (
                  task.get('taskArn', '').rsplit('/', 1)[-1] == os.environ['RECONCILIATION_TASK_ID']
                  and task.get('taskDefinitionArn') == os.environ['RECONCILIATION_TASK_DEFINITION_ARN']
                  and task.get('group') == os.environ['EXPECTED_SERVICE']
                  and lower <= started_epoch < upper
              ):
                  exact_task = task

          cloudtrail = json.loads((root / 'selected-cloudtrail-event.json').read_text(encoding='utf-8'))
          response_tasks = (cloudtrail.get('responseElements') or {}).get('tasks') or []
          cloudtrail_task = next(
              (
                  task for task in response_tasks
                  if str(task.get('taskArn') or '').rsplit('/', 1)[-1]
                  == os.environ['RECONCILIATION_TASK_ID']
              ),
              None,
          )
          if cloudtrail_task is None:
              raise SystemExit('exact CloudTrail scheduled reconciliation task is missing')
          cloudtrail_definition = str(cloudtrail_task.get('taskDefinitionArn') or '')
          if cloudtrail_definition and cloudtrail_definition != os.environ['RECONCILIATION_TASK_DEFINITION_ARN']:
              raise SystemExit('CloudTrail scheduled reconciliation task-definition drift')
          cloudtrail_group = str(cloudtrail_task.get('group') or '')
          if cloudtrail_group and cloudtrail_group != os.environ['EXPECTED_SERVICE']:
              raise SystemExit('CloudTrail scheduled reconciliation group drift')

          private_ip_text = ''
          runtime_source = 'cloudtrail_run_task_retention_recovery'
          runtime_retained = False
          if exact_task is not None:
              containers = exact_task.get('containers') or []
              if len(containers) != 1 or containers[0].get('exitCode') != 0:
                  raise SystemExit('retained scheduled reconciliation task did not stop successfully')
              if containers[0].get('imageDigest') != os.environ['RECONCILIATION_IMAGE_DIGEST']:
                  raise SystemExit('scheduled reconciliation image differs from localhost-gated deploy evidence')
              details = [
                  row
                  for attachment in exact_task.get('attachments') or []
                  for row in attachment.get('details') or []
              ]
              private_ip_text = str(next(
                  (
                      row.get('value') for row in details
                      if str(row.get('name') or '').lower() == 'privateipv4address'
                  ),
                  '',
              ))
              if not private_ip_text:
                  private_ip_text = str(next(
                      (
                          interface.get('privateIpv4Address')
                          or interface.get('privateIPv4Address')
                          for container in containers
                          for interface in container.get('networkInterfaces') or []
                          if interface.get('privateIpv4Address')
                          or interface.get('privateIPv4Address')
                      ),
                      '',
                  ))
              if not private_ip_text:
                  raise SystemExit('retained scheduled reconciliation task private IP missing')
              private_ip = ipaddress.ip_address(private_ip_text)
              if private_ip not in ipaddress.ip_network('172.31.0.0/16'):
                  raise SystemExit('scheduled reconciliation task private IP drift')
              runtime_source = 'ecs_stopped_task'
              runtime_retained = True

          values = {
              'RECONCILIATION_TASK_ID': os.environ['RECONCILIATION_TASK_ID'],
              'RECONCILIATION_PRIVATE_IP': private_ip_text,
              'RECONCILIATION_LOG_STREAM': os.environ['RECONCILIATION_LOG_STREAM'],
              'RECONCILIATION_RUNTIME_IDENTITY_SOURCE': runtime_source,
              'RECONCILIATION_RUNTIME_STATE_RETAINED': str(runtime_retained).lower(),
          }
          for key, value in values.items():
              print(f'{key}={value}')
          PY
          cat "${TEMP_CHECKPOINT_DIR}/selected-task.env" >> "${GITHUB_ENV}"
          set -a
          source "${TEMP_CHECKPOINT_DIR}/selected-task.env"
          set +a
          echo "PRODUCTION_CTA_WINDOW_RUNTIME_GATE_OK:instance-id=N/A:Fargate:private-ip=${RECONCILIATION_PRIVATE_IP:-expired}:service=${EXPECTED_SERVICE}:path=${EXPECTED_RUNTIME_PATH}:source=${RECONCILIATION_RUNTIME_IDENTITY_SOURCE}:runtime-retained=${RECONCILIATION_RUNTIME_STATE_RETAINED}"

      - name: Verify exact scheduled success marker alarms and DLQ
        if: ${{ env.RUN_CHECKPOINT == 'true' }}
        run: |
          set -euo pipefail
          aws logs get-log-events --log-group-name "${RECONCILIATION_LOG_GROUP}" --log-stream-name "${RECONCILIATION_LOG_STREAM}" --start-from-head --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/task-logs.json"
          aws cloudwatch describe-alarms --alarm-names \
            vevo-growthbook-reconcile-production-failure \
            vevo-growthbook-reconcile-production-missing-success \
            vevo-growthbook-reconcile-production-dlq \
            --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/alarms.json"
          aws sqs get-queue-url --queue-name vevo-growthbook-reconcile-production-dlq --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/queue-url.json"
          QUEUE_URL="$(python - <<'PY'
          import json
          import os
          print(json.load(open(f"{os.environ['TEMP_CHECKPOINT_DIR']}/queue-url.json", encoding='utf-8'))['QueueUrl'])
          PY
          )"
          aws sqs get-queue-attributes --queue-url "${QUEUE_URL}" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesDelayed ApproximateNumberOfMessagesNotVisible --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/queue.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['TEMP_CHECKPOINT_DIR'])
          messages = [str(row.get('message') or '').strip() for row in json.load(open(root / 'task-logs.json', encoding='utf-8')).get('events') or []]
          markers = [row for row in messages if 'GROWTHBOOK_SCHEDULED_RECONCILIATION_OK:' in row]
          summaries = [json.loads(row) for row in messages if row.startswith('{') and '"mode":"publish"' in row]
          if len(markers) != 1 or len(summaries) != 1:
              raise SystemExit('scheduled reconciliation marker/summary drift')
          summary = summaries[0]
          published = summary.get('published') or {}
          expected = {key: summary.get(key) for key in ('device_facts', 'performance_facts', 'quality_reports')}
          if published != expected or summary.get('event_partitions') != 40:
              raise SystemExit('scheduled reconciliation generated/published parity drift')
          alarms = json.load(open(root / 'alarms.json', encoding='utf-8')).get('MetricAlarms') or []
          expected_alarms = {
              'vevo-growthbook-reconcile-production-failure',
              'vevo-growthbook-reconcile-production-missing-success',
              'vevo-growthbook-reconcile-production-dlq',
          }
          if {row.get('AlarmName') for row in alarms} != expected_alarms or any(row.get('StateValue') != 'OK' for row in alarms):
              raise SystemExit('Production reconciliation alarm gate failed')
          queue = json.load(open(root / 'queue.json', encoding='utf-8')).get('Attributes') or {}
          if any(int(queue.get(key, '-1')) != 0 for key in ('ApproximateNumberOfMessages', 'ApproximateNumberOfMessagesDelayed', 'ApproximateNumberOfMessagesNotVisible')):
              raise SystemExit('Production reconciliation DLQ is not empty')
          control = {
              'schedule_name': os.environ['EXPECTED_SERVICE'],
              'schedule_due_local': os.environ['CHECKPOINT_DUE_LOCAL'],
              'schedule_succeeded': True,
              'success_marker_sha256': hashlib.sha256(markers[0].encode()).hexdigest(),
              'publish_summary_sha256': hashlib.sha256((json.dumps(summary, sort_keys=True, separators=(',', ':')) + '\n').encode()).hexdigest(),
              'generated_published_counts_match': True,
              'dlq_empty': True,
              'alarms_clear': True,
              'source_schedule_name': os.environ['EXPECTED_SOURCE_SCHEDULE'],
              'source_schedule_unchanged': True,
              'scheduler_run_task_verified': True,
              'runtime_state_retained': os.environ['RECONCILIATION_RUNTIME_STATE_RETAINED'] == 'true',
          }
          (root / 'control.json').write_text(json.dumps(control, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          print('PRODUCTION_CTA_WINDOW_CONTROL_GATE_OK:marker=true:parity=true:alarms=clear:dlq=empty')
          PY

      - name: Query only the cumulative eligible-device count
        if: ${{ env.RUN_CHECKPOINT == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          query = f"""
          SELECT COUNT(DISTINCT device_id) AS eligible_devices
          FROM experiment_device_facts
          WHERE experiment_id = 'vevo-sk-product-cta-color-001'
            AND metric_contract_version = 'vevo_cm1_v1_2026-08-20'
            AND eligible = 1
            AND contaminated = 0
            AND from_iso8601_timestamp(first_exposure_at) >= from_iso8601_timestamp('{os.environ['CTA_STARTED_AT_UTC']}')
            AND from_iso8601_timestamp(first_exposure_at) < from_iso8601_timestamp('{os.environ['CANDIDATE_THROUGH_UTC']}')
          """.strip()
          Path(os.environ['TEMP_CHECKPOINT_DIR'], 'eligible-count.sql').write_text(query + '\n', encoding='utf-8')
          PY
          QUERY_ID="$(aws athena start-query-execution \
            --query-string "file://${TEMP_CHECKPOINT_DIR}/eligible-count.sql" \
            --query-execution-context "Database=${PRODUCTION_DATABASE}" \
            --work-group "${PRODUCTION_WORKGROUP}" \
            --region "${AWS_REGION}" \
            --query QueryExecutionId \
            --output text)"
          [[ -n "${QUERY_ID}" && "${QUERY_ID}" != 'None' ]]
          for _ in $(seq 1 30); do
            STATE="$(aws athena get-query-execution --query-execution-id "${QUERY_ID}" --region "${AWS_REGION}" --query 'QueryExecution.Status.State' --output text)"
            if [[ "${STATE}" == 'SUCCEEDED' ]]; then break; fi
            if [[ "${STATE}" == 'FAILED' || "${STATE}" == 'CANCELLED' ]]; then exit 1; fi
            sleep 5
          done
          [[ "${STATE}" == 'SUCCEEDED' ]]
          aws athena get-query-results --query-execution-id "${QUERY_ID}" --max-results 2 --region "${AWS_REGION}" > "${TEMP_CHECKPOINT_DIR}/eligible-count-result.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['TEMP_CHECKPOINT_DIR'])
          result_raw = (root / 'eligible-count-result.json').read_bytes()
          payload = json.loads(result_raw)
          rows = ((payload.get('ResultSet') or {}).get('Rows') or [])
          if len(rows) != 2 or payload.get('NextToken'):
              raise SystemExit('eligible-device aggregate result shape drift')
          header = [cell.get('VarCharValue') for cell in rows[0].get('Data') or []]
          values = [cell.get('VarCharValue') for cell in rows[1].get('Data') or []]
          if header != ['eligible_devices'] or len(values) != 1 or not str(values[0]).isdigit():
              raise SystemExit('eligible-device aggregate result schema drift')
          population = {
              'metric': 'cumulative_eligible_first_exposed_devices_without_arm_or_outcome_readback',
              'eligible_devices': int(values[0]),
              'target_total_sample': int(os.environ['TARGET_TOTAL_SAMPLE']),
              'database': os.environ['EXPECTED_DATABASE'],
              'workgroup': os.environ['EXPECTED_WORKGROUP'],
              'source_table': 'experiment_device_facts',
              'aggregate_query_sha256': hashlib.sha256((root / 'eligible-count.sql').read_bytes()).hexdigest(),
              'aggregate_result_sha256': hashlib.sha256(result_raw).hexdigest(),
              'only_aggregate_count_retained': True,
              'arm_counts_read': False,
              'arm_outcomes_read': False,
              'outcome_metrics_read': False,
              'contains_event_or_device_ids': False,
              'contains_customer_or_order_data': False,
          }
          (root / 'population.json').write_text(json.dumps(population, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          print('PRODUCTION_CTA_WINDOW_POPULATION_OK:aggregate-only=true:arm-outcomes=false')
          PY

      - name: Build and independently validate sanitized checkpoint evidence
        if: ${{ env.RUN_CHECKPOINT == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          from scripts.validate_growthbook_cta_measurement_window import canonical_evidence_bytes, expected_measurement_window, validate_checkpoint_evidence

          root = Path(os.environ['TEMP_CHECKPOINT_DIR'])
          activation = json.load(open('projects/vevo/growthbook_cta_activation.json', encoding='utf-8'))
          start_observation = json.load(open('projects/vevo/growthbook_cta_activation_observation.json', encoding='utf-8'))
          sample = json.load(open('projects/vevo/growthbook_cta_sample_plan.json', encoding='utf-8'))
          contract = json.load(open('projects/vevo/growthbook_cta_decision_contract.json', encoding='utf-8'))
          reconciliation = json.load(open(os.environ['DEPLOY_EVIDENCE'], encoding='utf-8'))
          expected = expected_measurement_window(
              activation, start_observation, sample, contract, reconciliation
          )
          population = json.load(open(root / 'population.json', encoding='utf-8'))
          index = int(os.environ['CHECKPOINT_INDEX'])
          candidate_through = datetime.fromisoformat(os.environ['CANDIDATE_THROUGH_UTC'].replace('Z', '+00:00'))
          due = datetime.fromisoformat(os.environ['CHECKPOINT_DUE_LOCAL'])
          evidence = {
              'schema_version': 2,
              'evidence_type': 'vevo_growthbook_cta_window_checkpoint',
              'status': 'passed',
              'experiment_id': 'vevo-sk-product-cta-color-001',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow': '.github/workflows/check-vevo-growthbook-production-cta-window.yml',
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'main_commit': os.environ['GITHUB_SHA'],
              'observed_at_utc': datetime.now(UTC).isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'window': {
                  'timezone': 'Europe/Bratislava',
                  'checkpoint_index': index,
                  'assignment_started_at_utc': os.environ['CTA_STARTED_AT_UTC'],
                  'candidate_through_utc': os.environ['CANDIDATE_THROUGH_UTC'],
                  'candidate_last_full_local_date': (candidate_through.astimezone(due.tzinfo).date() - timedelta(days=1)).isoformat(),
                  'full_calendar_days': 14 + index - 1,
                  'resolution_due_local': os.environ['CHECKPOINT_DUE_LOCAL'],
              },
              'runtime': {
                  'instance_id': 'N/A:Fargate',
                  'private_ip': os.environ['RECONCILIATION_PRIVATE_IP'] or None,
                  'service': os.environ['EXPECTED_SERVICE'],
                  'runtime_path': os.environ['EXPECTED_RUNTIME_PATH'],
                  'task_id': os.environ['RECONCILIATION_TASK_ID'],
                  'task_definition': os.environ['RECONCILIATION_TASK_DEFINITION'],
                  'image_digest': os.environ['RECONCILIATION_IMAGE_DIGEST'],
                  'identity_source': os.environ['RECONCILIATION_RUNTIME_IDENTITY_SOURCE'],
                  'host_gate_evidence_sha256': '21fb2aab84f4839ccff04ca1a479e2ba2de4fef516a86b748a061957459baacb',
                  'localhost_health_marker_inherited_from_deploy_evidence': True,
                  'localhost_runtime_marker_inherited_from_deploy_evidence': True,
              },
              'control_plane': json.load(open(root / 'control.json', encoding='utf-8')),
              'population': population,
              'decision': (
                  'open_manual_stop_review_maximum_duration_reached'
                  if 14 + index - 1 >= 42
                  else (
                      'open_manual_stop_review_target_reached'
                      if population['eligible_devices'] >= population['target_total_sample']
                      else 'extend_one_full_local_day'
                  )
              ),
              'safety': {
                  'contains_raw_aws_payloads': False,
                  'contains_cloudwatch_messages': False,
                  'contains_credentials': False,
                  'aws_mutations': False,
                  'growthbook_mutations': False,
                  'gtm_mutations': False,
                  'meta_ads_mutations': False,
                  'biznisweb_mutations': False,
                  'collector_or_reporting_mutations': False,
                  'commerce_mutations': False,
                  'winner_calls': False,
                  'assignment_stopped': False,
              },
          }
          validate_checkpoint_evidence(evidence, expected, index)
          Path(os.environ['EVIDENCE_FILE']).write_bytes(canonical_evidence_bytes(evidence))
          print('PRODUCTION_CTA_WINDOW_EVIDENCE_OK:canonical=true:identity-free=true:winner=false')
          PY

      - name: Remove every temporary AWS response and query file
        if: ${{ always() && env.RUN_CHECKPOINT == 'true' }}
        run: |
          set -euo pipefail
          TARGET="${TEMP_CHECKPOINT_DIR:-}"
          [[ -n "${TARGET}" && "${TARGET}" == "${RUNNER_TEMP}"/vevo-cta-window-* ]]
          if [[ -d "${TARGET}" ]]; then
            find "${TARGET}" -type f -exec shred -f -u -- {} + 2>/dev/null || find "${TARGET}" -type f -delete
            rmdir "${TARGET}"
          fi

      - name: Upload only sanitized outcome-blind checkpoint evidence
        if: ${{ env.RUN_CHECKPOINT == 'true' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: vevo-growthbook-cta-window-checkpoint
          path: vevo-growthbook-cta-window-checkpoint.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish checkpoint summary
        if: ${{ env.RUN_CHECKPOINT == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          evidence = json.load(open(os.environ['EVIDENCE_FILE'], encoding='utf-8'))
          print('## VEVO Production CTA outcome-blind checkpoint')
          print(f"- Checkpoint: `{evidence['window']['checkpoint_index']}`")
          print(f"- Candidate through: `{evidence['window']['candidate_through_utc']}`")
          print(f"- Eligible devices: `{evidence['population']['eligible_devices']}`")
          print(f"- Decision: `{evidence['decision']}`")
          print('- Arm counts/outcomes read: `false / false`')
          print('- GrowthBook, GTM, Meta Ads, BiznisWeb and commerce mutation: `none`')
          print('- Assignment stop/winner/external mutation gates changed: `none`')
          PY
