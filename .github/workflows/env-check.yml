name: Env Check

on:
  pull_request:
  push:
    branches:
      - main
      - opan-claw
      - codex/week-of-month-pattern

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  env-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate required env keys against template
        run: |
          chmod +x scripts/check_env.sh
          # CI validates the template contract itself (required keys must exist in .env.example)
          scripts/check_env.sh .env.example .env.example .env.required

      - name: Ensure no secret env files are tracked
        run: |
          set -euo pipefail
          bad_files=""
          while IFS= read -r f; do
            case "$f" in
              .env|.env.local|projects/*/.env|*.env.runtime)
                bad_files+="$f\n"
                ;;
            esac
          done < <(git ls-files)

          if [[ -n "$bad_files" ]]; then
            echo "Tracked secret env files are not allowed:"
            printf "%b" "$bad_files"
            exit 1
          fi

          echo "OK: no tracked secret env files detected."

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reporting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baseline security assertions
        run: |
          python3 scripts/security_ci.py

      - name: VEVO GrowthBook storefront unit tests
        run: |
          node --check storefront/vevo-growthbook/vevo-growthbook.js
          node --test tests/test_vevo_growthbook_storefront.js

      - name: VEVO GrowthBook collector host adapter
        run: |
          python3 -m unittest \
            tests.test_growthbook_collector \
            tests.test_growthbook_collector_server \
            tests.test_growthbook_changeset
          docker build -f growthbook_collector/Dockerfile -t vevo-growthbook-collector:ci .
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -e AWS_ACCESS_KEY_ID=ci-placeholder \
            -e AWS_SECRET_ACCESS_KEY=ci-placeholder \
            -e AWS_EC2_METADATA_DISABLED=true \
            -e AWS_REGION=eu-central-1 \
            -e GROWTHBOOK_ALLOWED_ORIGINS=https://www.vevo.sk \
            -e GROWTHBOOK_COLLECTOR_VERSION=git-ci-host-gate \
            -e GROWTHBOOK_ENVIRONMENT=preview \
            -e GROWTHBOOK_EVENT_BUCKET=ci-placeholder \
            -e GROWTHBOOK_EXPERIMENT_REGISTRY_PATH=/app/growthbook_collector/experiments.json \
            vevo-growthbook-collector:ci \
            /bin/sh /app/growthbook_collector/host_gate.sh

      - name: VEVO GrowthBook workspace contract
        run: |
          python3 scripts/validate_growthbook_workspace.py
          python3 -m unittest \
            tests.test_growthbook_workspace \
            tests.test_growthbook_natural_reconciliation_verifier \
            tests.test_growthbook_natural_reconciliation_workflow

      - name: VEVO GrowthBook reconciliation host gate
        run: |
          docker build -t vevo-reporting-growthbook:ci .
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -e REPORT_PROJECT=vevo \
            -e GROWTHBOOK_ENVIRONMENT=preview \
            -e GROWTHBOOK_RECONCILE_VERSION=git-ci-host-gate \
            vevo-reporting-growthbook:ci \
            /bin/bash /app/scripts/growthbook_preview_reconcile_host_gate.sh

      - name: Validate VEVO GrowthBook CloudFormation
        run: |
          python -m pip install cfn-lint==1.55.1
          cfn-lint infra/vevo-growthbook/template.yaml
          cfn-lint infra/vevo-growthbook-reconciliation/template.yaml

      - name: Reporting QA smoke test
        run: |
          python3 scripts/reporting_qa_smoke.py
